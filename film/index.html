<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Vantalogics — La señal</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #7c7a74; font: 11px ui-monospace, monospace; overflow: hidden; }
      #stage { position: absolute; inset: 0; display: grid; place-items: center; }
      #view { height: calc(100vh - 48px); max-width: 100vw; width: auto; aspect-ratio: var(--ar, 16 / 9); background: #050505; display: block; object-fit: contain; }
      body.export #view { width: auto; height: auto; position: absolute; left: 0; top: 0; }
      body.export #bar { display: none; }
      #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; gap: 16px; align-items: center; padding: 0 16px; }
      #scrub { flex: 1; accent-color: #f28a2e; }
      body.hide #bar { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view" width="1920" height="1080"></canvas></div>
    <div id="bar"><span id="tc">00.000</span><input id="scrub" type="range" min="0" max="45" step="0.0166667" value="0" /><span id="info"></span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
